      PORT: 9006
    ports:
      - "9006:9006"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9006/health || exit 1"]
      <<: *healthcheck
    volumes: *shared-volume
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  email-backend-api:
    build:
      context: ./apis
      dockerfile: email~backend-api/Dockerfile
    container_name: croo-email-backend-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *db-env]
      PORT: 9007
    ports:
      - "9007:9007"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9007/health || exit 1"]
      <<: *healthcheck
    volumes: *shared-volume
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent-backend-api:
    build:
      context: ./apis
      dockerfile: agent~backend-api/Dockerfile
    container_name: croo-agent-backend-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *db-env]
      PORT: 9008
    ports:
      - "9008:9008"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9008/health || exit 1"]
      <<: *healthcheck
    volumes: *shared-volume
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  workflow-backend-api:
    build:
      context: ./apis
      dockerfile: workflow~backend-api/Dockerfile
    container_name: croo-workflow-backend-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *db-env]
      PORT: 9009
    ports:
      - "9009:9009"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9009/health || exit 1"]
      <<: *healthcheck
    volumes: *shared-volume
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  kb-backend-api:
    build:
      context: ./apis
      dockerfile: kb~backend-api/Dockerfile
    container_name: croo-kb-backend-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *db-env]
      PORT: 9010
    ports:
      - "9010:9010"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9010/health || exit 1"]
      <<: *healthcheck
    volumes: *shared-volume
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  usage-backend-api:
    build:
      context: ./apis
      dockerfile: usage~backend-api/Dockerfile
    container_name: croo-usage-backend-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *db-env]
      PORT: 9011
    ports:
      - "9011:9011"
    healthcheck:
