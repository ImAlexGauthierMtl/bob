        condition: service_healthy
      redis:
        condition: service_healthy

  # ═══════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: croo-frontend
    restart: unless-stopped
    ports:
      - "4700:4700"
    depends_on:
      auth-b4f-api:
        condition: service_healthy

volumes:
  pgdata:
