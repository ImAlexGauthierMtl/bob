    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9001/health || exit 1"]
      <<: *healthcheck
    volumes:
      - ./apis/internal/user-backend-api/app:/app/app
      - ./apis/internal/user-backend-api/main.py:/app/main.py
      - ./apis/internal/user-backend-api/alembic:/app/alembic

    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      alloy:
        condition: service_started

