      <<: [*common-env, *db-env]
      PORT: 9008
    ports:
      - "${AGENT_BACKEND_API_PORT:-9008}:9008"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9008/health || exit 1"]
      <<: *healthcheck
    volumes:
      - ./apis/internal/agent-backend-api/app:/app/app
      - ./apis/internal/agent-backend-api/main.py:/app/main.py
      - ./apis/internal/agent-backend-api/alembic:/app/alembic

