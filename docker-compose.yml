      - ./apis/internal/opportunity-backend-api/alembic:/app/alembic

    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      alloy:
        condition: service_started

  activity-backend-api:
    build:
      context: .
      dockerfile: apis/internal/activity-backend-api/Dockerfile
      target: dev
    container_name: croo-activity-backend-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *db-env]
      PORT: 9005
    ports:
      - "${ACTIVITY_BACKEND_API_PORT:-9005}:9005"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9005/health || exit 1"]
      <<: *healthcheck
    volumes:
