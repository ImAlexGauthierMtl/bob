x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-true}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-not-for-production}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:4200","http://localhost:4300","http://localhost:4700","http://localhost:24200","http://127.0.0.1:4200","http://127.0.0.1:4300","http://127.0.0.1:4700","http://127.0.0.1:24200"]}
  CDE_LOCAL_BOB_SETTINGS_CAPABILITIES: ${CDE_LOCAL_BOB_SETTINGS_CAPABILITIES:-bob_settings.manage}
  INGRESS_URL: ${INGRESS_URL:-http://localhost:4700}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  EVENT_BUS_BACKEND: ${EVENT_BUS_BACKEND:-redis}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
  OTLP_URL: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}

x-db-env: &db-env
  DB_HOST: ${DB_HOST:-pgbouncer}
  DB_PORT: ${DB_PORT:-5432}
  DB_USERNAME: ${DB_USERNAME:-croo}
  DB_PASSWORD: ${DB_PASSWORD:-croo}
  DB_DATABASE: ${DB_DATABASE:-croo_digital_experience}
  DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
  DATABASE_URL: postgresql://${DB_USERNAME:-croo}:${DB_PASSWORD:-croo}@${DB_HOST:-pgbouncer}:${DB_PORT:-5432}/${DB_DATABASE:-croo_digital_experience}?sslmode=${DATABASE_SSLMODE:-disable}

x-backend-urls: &backend-urls
  USER_BACKEND_API_URL: http://user-backend-api:9001
  CONTACT_BACKEND_API_URL: http://contact-backend-api:9002
  ORG_BACKEND_API_URL: http://org-backend-api:9003
  OPPORTUNITY_BACKEND_API_URL: http://opportunity-backend-api:9004
  ACTIVITY_BACKEND_API_URL: http://activity-backend-api:9005
  PRODUCT_BACKEND_API_URL: http://product-backend-api:9006
  EMAIL_BACKEND_API_URL: http://email-backend-api:9007
  AGENT_BACKEND_API_URL: http://agent-backend-api:9008
  WORKFLOW_BACKEND_API_URL: http://workflow-backend-api:9009
  KB_BACKEND_API_URL: http://kb-backend-api:9010
  USAGE_BACKEND_API_URL: http://usage-backend-api:9011
  CONVERSATION_BACKEND_API_URL: http://conversation-backend-api:9012
  AGENT_RUNTIME_BACKEND_API_URL: http://agent-runtime-backend-api:9013
  AGENT_MEMORY_BACKEND_API_URL: http://agent-memory-backend-api:9014

x-shared-volume: &shared-volume
  - ./apis/shared:/shared:ro

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

services:
  # ═══════════════════════════════════════
  # INFRASTRUCTURE
  # ═══════════════════════════════════════
  database:
    image: postgres:16-alpine
    container_name: croo-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-croo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-croo}
      POSTGRES_DB: ${DB_DATABASE:-croo_digital_experience}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-croo} -d ${DB_DATABASE:-croo_digital_experience}"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.24.1
    container_name: croo-pgbouncer
    restart: unless-stopped
    environment:
      POSTGRESQL_HOST: database
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USERNAME: ${DB_USERNAME:-croo}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD:-croo}
      POSTGRESQL_DATABASE: ${DB_DATABASE:-croo_digital_experience}
      PGBOUNCER_DATABASE: ${DB_DATABASE:-croo_digital_experience}
      PGBOUNCER_PORT: 5432
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_AUTH_TYPE: md5
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
    ports:
      - "${PGBOUNCER_HOST_PORT:-6432}:5432"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/common/bin/wait-for-port --host 127.0.0.1 --timeout 1 5432"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: croo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: croo-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    ports:
      - "${ALLOY_HTTP_PORT:-12345}:12345"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro

  # ═══════════════════════════════════════
  # B4F LAYER — Business logic (exposed)
  # ═══════════════════════════════════════
  bob-cloud-stub-api:
    build:
      context: .
      dockerfile: apis/exposed/bob-cloud-stub-api/Dockerfile
      target: dev
    container_name: croo-bob-cloud-stub-api
    restart: unless-stopped
    environment:
      <<: *common-env
      PORT: 8010
      BOB_CLOUD_MODE: stub
      ENV: ${ENV:-development}
    ports:
      - "${BOB_CLOUD_STUB_API_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8010/health || exit 1"]
      <<: *healthcheck
    volumes:
      - ./apis/exposed/bob-cloud-stub-api/app:/app/app
      - ./apis/exposed/bob-cloud-stub-api/main.py:/app/main.py

  auth-b4f-api:
    build:
      context: .
      dockerfile: apis/exposed/auth-b4f-api/Dockerfile
      target: dev
    container_name: croo-auth-b4f-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *backend-urls]
      PORT: 8001
      SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-not-for-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS:-5}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-15}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@croo.digital}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "${AUTH_B4F_API_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      <<: *healthcheck
    volumes:
      - ./apis/exposed/auth-b4f-api/app:/app/app
      - ./apis/exposed/auth-b4f-api/main.py:/app/main.py

    depends_on:
      user-backend-api:
        condition: service_healthy

  crm-b4f-api:
    build:
      context: .
      dockerfile: apis/exposed/crm-b4f-api/Dockerfile
      target: dev
    container_name: croo-crm-b4f-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *backend-urls]
      PORT: 8002
    ports:
      - "${CRM_B4F_API_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/health || exit 1"]
      <<: *healthcheck
    volumes:
      - ./apis/exposed/crm-b4f-api/app:/app/app
      - ./apis/exposed/crm-b4f-api/main.py:/app/main.py

    depends_on:
      contact-backend-api:
        condition: service_healthy
      org-backend-api:
        condition: service_healthy

  agent-control-b4f-api:
    build:
      context: .
      dockerfile: apis/exposed/agent-control-b4f-api/Dockerfile
      target: dev
    container_name: croo-agent-control-b4f-api
    restart: unless-stopped
    environment:
      <<: *backend-urls
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-not-for-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:4200","http://localhost:4300","http://localhost:4700","http://localhost:24200","http://127.0.0.1:4200","http://127.0.0.1:4300","http://127.0.0.1:4700","http://127.0.0.1:24200"]}
      CDE_LOCAL_BOB_SETTINGS_CAPABILITIES: ${CDE_LOCAL_BOB_SETTINGS_CAPABILITIES:-bob_settings.manage}
      CDE_LOCAL_AGENT_CONTROL_CAPABILITIES: ${CDE_LOCAL_AGENT_CONTROL_CAPABILITIES:-agent_control.manage}
      INGRESS_URL: ${INGRESS_URL:-http://localhost:4700}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      OTLP_URL: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4317}
      PORT: 8008
      API_PORT: 8008
      API_NAME: agent-control-b4f-api
      OTEL_SERVICE_NAME: agent-control-b4f-api
      CDE_B4F_SURFACE: agent-control
    ports:
      - "${AGENT_CONTROL_B4F_API_PORT:-8008}:8008"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      <<: *healthcheck
    volumes:
      - ./apis/exposed/agent-control-b4f-api/app:/app/app
      - ./apis/exposed/agent-control-b4f-api/main.py:/app/main.py

    depends_on:
      agent-backend-api:
        condition: service_healthy

  communication-b4f-api:
    build:
      context: .
      dockerfile: apis/exposed/communication-b4f-api/Dockerfile
      target: dev
    container_name: croo-communication-b4f-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *backend-urls]
      PORT: 8004
      MS365_CLIENT_ID: ${MS365_CLIENT_ID}
      MS365_CLIENT_SECRET: ${MS365_CLIENT_SECRET}
      MS365_TENANT_ID: ${MS365_TENANT_ID}
      MS365_REDIRECT_URI: ${MS365_REDIRECT_URI}
      MS365_WEBHOOK_HOST: ${MS365_WEBHOOK_HOST}
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY}
      PIPEDREAM_CLIENT_ID: ${PIPEDREAM_CLIENT_ID}
      PIPEDREAM_CLIENT_SECRET: ${PIPEDREAM_CLIENT_SECRET}
      PIPEDREAM_PROJECT_ID: ${PIPEDREAM_PROJECT_ID}
      PIPEDREAM_ENVIRONMENT: ${PIPEDREAM_ENVIRONMENT:-development}
      PIPEDREAM_API_URL: ${PIPEDREAM_API_URL:-https://api.pipedream.com/v1}
      PIPEDREAM_WEBHOOK_SECRET: ${PIPEDREAM_WEBHOOK_SECRET}
      PIPEDREAM_SEND_EMAIL_ACTION_ID: ${PIPEDREAM_SEND_EMAIL_ACTION_ID}
      PIPEDREAM_REPLY_EMAIL_ACTION_ID: ${PIPEDREAM_REPLY_EMAIL_ACTION_ID}
      PIPEDREAM_FORWARD_EMAIL_ACTION_ID: ${PIPEDREAM_FORWARD_EMAIL_ACTION_ID}
      PIPEDREAM_SYNC_EMAILS_ACTION_ID: ${PIPEDREAM_SYNC_EMAILS_ACTION_ID}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:28004}
    ports:
      - "${COMMUNICATION_B4F_API_PORT:-8004}:8004"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8004/health || exit 1"]
      <<: *healthcheck
    volumes:
      - ./apis/exposed/communication-b4f-api/app:/app/app
      - ./apis/exposed/communication-b4f-api/main.py:/app/main.py

    depends_on:
      email-backend-api:
        condition: service_healthy

  platform-b4f-api:
    build:
      context: .
      dockerfile: apis/exposed/platform-b4f-api/Dockerfile
      target: dev
    container_name: croo-platform-b4f-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *backend-urls]
      PORT: 8005
      AGENT_RUNTIME_PROVIDER: ${AGENT_RUNTIME_PROVIDER:-auto}
    ports:
