    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8007/health || exit 1"]
      <<: *healthcheck
    volumes:
      - ./apis/exposed/bob-chat-b4f-api/app:/app/app
      - ./apis/exposed/bob-chat-b4f-api/main.py:/app/main.py

    depends_on:
      bob-cloud-stub-api:
        condition: service_healthy
      conversation-backend-api:
        condition: service_healthy
      agent-runtime-backend-api:
        condition: service_healthy
      agent-memory-backend-api:
        condition: service_healthy

  # ═══════════════════════════════════════
  # BACKEND LAYER — CRUD + Events (internal)
  # ═══════════════════════════════════════
  user-backend-api:
    build:
      context: .
      dockerfile: apis/internal/user-backend-api/Dockerfile
      target: dev
    container_name: croo-user-backend-api
    restart: unless-stopped
    environment:
      <<: [*common-env, *db-env]
      PORT: 9001
    ports:
