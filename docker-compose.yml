  # ═══════════════════════════════════════
  # FRONTEND
  # ═══════════════════════════════════════
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: croo-frontend
    restart: unless-stopped
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
    deploy:
      resources:
        limits:
          memory: 3g
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      auth-b4f-api:
        condition: service_healthy

volumes:
  pgdata:
