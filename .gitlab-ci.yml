# =============================================================================
# DYNAMIC API JOBS (child pipeline generators)
# =============================================================================

# ── Generate API test jobs ──
generate:api-test-jobs:
  stage: .pre
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - apk add --no-cache bash
    - chmod +x deploy/scripts/*.sh
    - |
      APIS=$(./deploy/scripts/discover-apis.sh)
      echo "Discovered APIs: ${APIS}"
      mkdir -p .gitlab/ci

      cat > .gitlab/ci/api-test-jobs.yml << 'HEREDOC'
      stages:
        - test
      variables:
        CI_CHILD_PIPELINE: "true"
      .test_template: &test_template
        stage: test
        image: python:3.11-slim
        cache:
          key: ${CI_COMMIT_REF_SLUG}-python
          paths:
            - .pip-cache/
        before_script:
          - apt-get update && apt-get install -y git
          - pip install --cache-dir=.pip-cache --upgrade pip
          - pip install --cache-dir=.pip-cache pytest pytest-cov pytest-asyncio httpx
        script:
          - |
            if [ -d "apis/exposed/${API_NAME}" ]; then DIR_PATH="apis/exposed/${API_NAME}"
            elif [ -d "apis/internal/${API_NAME}" ]; then DIR_PATH="apis/internal/${API_NAME}"
            else echo "ERROR: API not found: ${API_NAME}"; exit 1; fi
            cd "${DIR_PATH}"
            pip install --cache-dir=../../../.pip-cache -r requirements.txt
            export PYTHONPATH="$(cd ../../.. && pwd)/apis:$PYTHONPATH"
            if [ -f "run_tests.sh" ]; then chmod +x run_tests.sh; ./run_tests.sh
            else python -m pytest tests/ -v --tb=short --junitxml=test-results.xml 2>/dev/null || echo "No tests found"; fi
        artifacts:
          when: always
          reports:
            junit: apis/**/test-results.xml
          expire_in: 30 days
      HEREDOC

      for api in ${APIS}; do
        echo "" >> .gitlab/ci/api-test-jobs.yml
        echo "test:${api}:" >> .gitlab/ci/api-test-jobs.yml
        echo "  extends: .test_template" >> .gitlab/ci/api-test-jobs.yml
        echo "  variables:" >> .gitlab/ci/api-test-jobs.yml
        echo "    API_NAME: ${api}" >> .gitlab/ci/api-test-jobs.yml
      done
  artifacts:
    paths:
      - .gitlab/ci/api-test-jobs.yml
    expire_in: 1 hour

# ── Generate API build jobs ──
generate:api-build-jobs:
  stage: .pre
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG'
    - when: never
  script:
    - apk add --no-cache bash
    - chmod +x deploy/scripts/*.sh
    - |
      APIS=$(./deploy/scripts/discover-apis.sh)
      mkdir -p .gitlab/ci

      cat > .gitlab/ci/api-build-jobs.yml << 'HEREDOC'
      stages:
        - build
      variables:
        CI_CHILD_PIPELINE: "true"
        DOCKER_DRIVER: overlay2
        DOCKER_TLS_CERTDIR: "/certs"
      .build_template: &build_template
        stage: build
        image: docker:24
        services:
          - docker:24-dind
        before_script:
          - |
            if [ -z "$CI_SERVER_HOST" ]; then echo "ERROR: CI_SERVER_HOST not set"; exit 1; fi
            if [ -z "$CI_PROJECT_PATH" ]; then echo "ERROR: CI_PROJECT_PATH not set"; exit 1; fi
            if [ -z "$CI_REGISTRY" ]; then export CI_REGISTRY="registry.${CI_SERVER_HOST}"; fi
            export CI_REGISTRY_IMAGE="${CI_REGISTRY}/${CI_PROJECT_PATH}"
          - set +x
          - echo "$CI_JOB_TOKEN" | docker login -u ${CI_REGISTRY_USER:-gitlab-ci-token} --password-stdin $CI_REGISTRY
        script:
          - |
            if [ -d "apis/exposed/${API_NAME}" ]; then DIR_PATH="apis/exposed/${API_NAME}"
            elif [ -d "apis/internal/${API_NAME}" ]; then DIR_PATH="apis/internal/${API_NAME}"
            else echo "ERROR: API not found: ${API_NAME}"; exit 1; fi
            docker pull ${CI_REGISTRY_IMAGE}/${API_NAME}:latest || true
            docker build \
              --cache-from ${CI_REGISTRY_IMAGE}/${API_NAME}:latest \
              --target production \
              -f ${DIR_PATH}/Dockerfile \
              -t ${CI_REGISTRY_IMAGE}/${API_NAME}:${CI_COMMIT_SHA} .
            docker tag ${CI_REGISTRY_IMAGE}/${API_NAME}:${CI_COMMIT_SHA} ${CI_REGISTRY_IMAGE}/${API_NAME}:latest
            docker push ${CI_REGISTRY_IMAGE}/${API_NAME}:${CI_COMMIT_SHA}
            docker push ${CI_REGISTRY_IMAGE}/${API_NAME}:latest
      HEREDOC

      for api in ${APIS}; do
        echo "" >> .gitlab/ci/api-build-jobs.yml
        echo "build:${api}:" >> .gitlab/ci/api-build-jobs.yml
        echo "  extends: .build_template" >> .gitlab/ci/api-build-jobs.yml
        echo "  variables:" >> .gitlab/ci/api-build-jobs.yml
        echo "    API_NAME: ${api}" >> .gitlab/ci/api-build-jobs.yml
      done
  artifacts:
    paths:
      - .gitlab/ci/api-build-jobs.yml
    expire_in: 1 hour

# ── Generate API deploy + migrate jobs (all envs) ──
generate:api-deploy-jobs:
  stage: .pre
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG'
    - when: never
  script:
    - apk add --no-cache bash
    - chmod +x deploy/scripts/*.sh
    - |
      APIS=$(./deploy/scripts/discover-apis.sh)
      mkdir -p .gitlab/ci

      # Write header with templates
      cat > .gitlab/ci/api-deploy-jobs.yml << 'HEREDOC'
      stages:
        - deploy-dev
        - migrate-dev
        - deploy-staging
        - migrate-staging
        - deploy-prod
        - migrate-prod
      variables:
        CI_CHILD_PIPELINE: "true"
      .deploy_template: &deploy_template
        image: alpine:latest
        before_script:
          - apk add --no-cache bash curl helm
          - |
            KUBECTL_VERSION="v1.30.0"
            curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
          - |
            if [ -z "$CROO_KUBECONFIG" ]; then echo "ERROR: CROO_KUBECONFIG not set"; exit 1; fi
            mkdir -p ~/.kube
            echo "$CROO_KUBECONFIG" | base64 -d > "$HOME/.kube/config" 2>&1
            chmod 600 "$HOME/.kube/config"
            export KUBECONFIG="$HOME/.kube/config"
          - chmod +x deploy/scripts/*.sh
      .migrate_template: &migrate_template
        image: python:3.11-slim
        before_script:
          - apt-get update && apt-get install -y git curl bash
          - |
            curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
            chmod +x kubectl && mv kubectl /usr/local/bin/kubectl
          - |
            if [ -z "$CROO_KUBECONFIG" ]; then exit 0; fi
            mkdir -p ~/.kube
            echo "$CROO_KUBECONFIG" | base64 -d > "$HOME/.kube/config" 2>&1
            chmod 600 "$HOME/.kube/config"
            export KUBECONFIG="$HOME/.kube/config"
          - |
            if [ -z "${DATABASE_HOST:-}" ] || [ -z "${DATABASE_USER:-}" ] || [ -z "${DATABASE_PASSWORD:-}" ]; then
              echo "Warning: DATABASE vars not set, skipping"; exit 0
            fi
            ENCODED_PASSWORD=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ.get('DATABASE_PASSWORD', ''), safe=''))")
            ENCODED_USER=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ.get('DATABASE_USER', ''), safe=''))")
            export DATABASE_URL="postgresql+psycopg://${ENCODED_USER}:${ENCODED_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-croo_digital_experience}"
          - chmod +x deploy/scripts/*.sh
          - pip install --upgrade pip
      HEREDOC

      # Generate jobs for each environment
      generate_env() {
        local ENV_NAME="$1" DEPLOY_STAGE="$2" MIGRATE_STAGE="$3" RULE="$4"
        local NS=$(./deploy/scripts/get-namespace.sh "$ENV_NAME")

        for api in ${APIS}; do
          cat >> .gitlab/ci/api-deploy-jobs.yml << EOF

      deploy:${api}:${ENV_NAME}:
        extends: .deploy_template
        stage: ${DEPLOY_STAGE}
        environment:
          name: ${ENV_NAME}
          url: \${INGRESS_URL}
        script:
          - ./deploy/scripts/deploy-api.sh ${api} ${ENV_NAME}
        rules:
          - ${RULE}
          - when: never
      EOF

          # Migration for backend APIs only
          if echo "${api}" | grep -q "backend-api"; then
            cat >> .gitlab/ci/api-deploy-jobs.yml << EOF

      migrate:${api}:${ENV_NAME}:
        extends: .migrate_template
        stage: ${MIGRATE_STAGE}
        environment:
          name: ${ENV_NAME}
        script:
          - |
            cd apis/internal/${api}
            pip install -r requirements.txt
            if [ -f "migrate.sh" ]; then chmod +x migrate.sh; ./migrate.sh
            elif [ -d "alembic" ]; then alembic upgrade head
            else echo "No migrations found, skipping"; fi
        rules:
          - ${RULE}
          - when: never
        needs:
          - job: deploy:${api}:${ENV_NAME}
            artifacts: false
      EOF
          fi
        done
      }

      generate_env "dev"     "deploy-dev"     "migrate-dev"     "if: '\$CI_COMMIT_BRANCH == \"develop\"'"
      generate_env "staging" "deploy-staging"  "migrate-staging" "if: '\$CI_COMMIT_BRANCH == \"main\"'"
      generate_env "prod"    "deploy-prod"     "migrate-prod"    "if: '\$CI_COMMIT_TAG'"
  artifacts:
    paths:
      - .gitlab/ci/api-deploy-jobs.yml
    expire_in: 1 hour

# ── Generate API smoke test jobs ──
generate:api-smoke-test-jobs:
  stage: .pre
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG'
    - when: never
  script:
    - apk add --no-cache bash
    - chmod +x deploy/scripts/*.sh
    - |
      APIS=$(./deploy/scripts/discover-apis.sh)
      mkdir -p .gitlab/ci

      cat > .gitlab/ci/api-smoke-test-jobs.yml << 'HEREDOC'
      stages:
        - smoke-test-dev
        - smoke-test-staging
        - smoke-test-prod
      variables:
        CI_CHILD_PIPELINE: "true"
      .smoke_test_template: &smoke_test_template
        image: curlimages/curl:latest
        timeout: 5m
        allow_failure: false
        before_script:
          - |
            wait_for_gateway() {
              local URL="${1}" MAX="${2:-30}" INTERVAL="${3:-5}"
              if [ -z "${URL}" ]; then return 1; fi
              echo "Waiting for gateway at ${URL}..."
              i=1; while [ ${i} -le ${MAX} ]; do
                HTTP_CODE=$(curl -k --max-time 10 -s -o /dev/null -w "%{http_code}" "${URL}/" 2>/dev/null)
                if [ -n "${HTTP_CODE}" ] && [ "${HTTP_CODE}" != "000" ]; then echo "Gateway ready"; return 0; fi
                sleep ${INTERVAL}; i=$((i + 1))
              done
              echo "Gateway not ready"; return 1
            }
      HEREDOC

      generate_smoke() {
        local ENV_NAME="$1" STAGE="$2" RULE="$3"
        for api in ${APIS}; do
          # Only smoke-test B4F (exposed) APIs
          echo "${api}" | grep -q "backend-api" && continue
          ROUTE=$(./deploy/scripts/get-api-route-prefix.sh "${api}" "${ENV_NAME}" 2>/dev/null || echo "${api}" | sed 's/-b4f-api$//')
          cat >> .gitlab/ci/api-smoke-test-jobs.yml << EOF

      smoke-test:${api}:${ENV_NAME}:
        extends: .smoke_test_template
        stage: ${STAGE}
        environment:
          name: ${ENV_NAME}
        script:
          - |
            wait_for_gateway "\${INGRESS_URL}" 30 5
            HEALTH_URL="\${INGRESS_URL}/api/v1/${ROUTE}/health"
            echo "Testing ${api} in ${ENV_NAME}..."
            sleep 60
            i=1; while [ \${i} -le 10 ]; do
              RESPONSE=\$(curl -k -s -w "\\n%{http_code}" --max-time 30 "\${HEALTH_URL}" 2>/dev/null)
              HTTP_CODE=\$(echo "\${RESPONSE}" | tail -n1)
              BODY=\$(echo "\${RESPONSE}" | sed '\$d')
              if [ "\${HTTP_CODE}" = "200" ] && echo "\${BODY}" | grep -q '"status"'; then
                echo "${api} healthy"; exit 0
              fi
              echo "Attempt \${i} failed (HTTP \${HTTP_CODE}), retrying..."
              sleep 10; i=\$((i + 1))
            done
            exit 1
        rules:
          - ${RULE}
          - when: never
      EOF
        done
      }

      generate_smoke "dev"     "smoke-test-dev"     "if: '\$CI_COMMIT_BRANCH == \"develop\"'"
      generate_smoke "staging" "smoke-test-staging"  "if: '\$CI_COMMIT_BRANCH == \"main\"'"
      generate_smoke "prod"    "smoke-test-prod"     "if: '\$CI_COMMIT_TAG'"
  artifacts:
    paths:
      - .gitlab/ci/api-smoke-test-jobs.yml
    expire_in: 1 hour

# =============================================================================
# CHILD PIPELINE TRIGGERS
# =============================================================================

trigger:api-tests-jobs:
  stage: test
  trigger:
    include:
      - artifact: .gitlab/ci/api-test-jobs.yml
        job: generate:api-test-jobs
    strategy: depend
  needs:
    - job: generate:api-test-jobs
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

trigger:api-build-jobs:
  stage: build
  trigger:
    include:
      - artifact: .gitlab/ci/api-build-jobs.yml
        job: generate:api-build-jobs
    strategy: depend
  needs:
    - job: generate:api-build-jobs
      artifacts: true
    - job: trigger:api-tests-jobs
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ── Dev triggers ──
trigger:api-deploy-jobs:dev:
  stage: deploy-dev
  trigger:
    include:
      - artifact: .gitlab/ci/api-deploy-jobs.yml
        job: generate:api-deploy-jobs
    strategy: depend
  needs:
    - job: generate:api-deploy-jobs
      artifacts: true
    - job: trigger:api-build-jobs
      artifacts: false
  rules:
    - if: '$CI_CHILD_PIPELINE != "true" && $CI_COMMIT_BRANCH == "develop"'
    - when: never

trigger:api-smoke-test-jobs:dev:
  stage: smoke-test-dev
  trigger:
    include:
      - artifact: .gitlab/ci/api-smoke-test-jobs.yml
        job: generate:api-smoke-test-jobs
    strategy: depend
  needs:
    - job: generate:api-smoke-test-jobs
      artifacts: true
    - job: trigger:api-deploy-jobs:dev
      artifacts: false
    - job: deploy:gateway:dev
      artifacts: false
  rules:
    - if: '$CI_CHILD_PIPELINE != "true" && $CI_COMMIT_BRANCH == "develop"'
    - when: never

# ── Staging triggers ──
trigger:api-deploy-jobs:staging:
  stage: deploy-staging
  trigger:
    include:
      - artifact: .gitlab/ci/api-deploy-jobs.yml
        job: generate:api-deploy-jobs
    strategy: depend
  needs:
    - job: generate:api-deploy-jobs
      artifacts: true
    - job: trigger:api-build-jobs
      artifacts: false
  rules:
    - if: '$CI_CHILD_PIPELINE != "true" && $CI_COMMIT_BRANCH == "main"'
    - when: never

trigger:api-smoke-test-jobs:staging:
  stage: smoke-test-staging
  trigger:
    include:
      - artifact: .gitlab/ci/api-smoke-test-jobs.yml
        job: generate:api-smoke-test-jobs
    strategy: depend
  needs:
    - job: generate:api-smoke-test-jobs
      artifacts: true
    - job: trigger:api-deploy-jobs:staging
      artifacts: false
    - job: deploy:gateway:staging
      artifacts: false
  rules:
    - if: '$CI_CHILD_PIPELINE != "true" && $CI_COMMIT_BRANCH == "main"'
    - when: never

# ── Prod triggers ──
trigger:api-deploy-jobs:prod:
  stage: deploy-prod
  trigger:
    include:
      - artifact: .gitlab/ci/api-deploy-jobs.yml
        job: generate:api-deploy-jobs
    strategy: depend
  needs:
    - job: generate:api-deploy-jobs
      artifacts: true
    - job: trigger:api-build-jobs
      artifacts: false
  rules:
    - if: '$CI_CHILD_PIPELINE != "true" && $CI_COMMIT_TAG'
    - when: never

trigger:api-smoke-test-jobs:prod:
  stage: smoke-test-prod
  trigger:
    include:
      - artifact: .gitlab/ci/api-smoke-test-jobs.yml
        job: generate:api-smoke-test-jobs
    strategy: depend
  needs:
    - job: generate:api-smoke-test-jobs
      artifacts: true
    - job: trigger:api-deploy-jobs:prod
      artifacts: false
    - job: deploy:gateway:prod
      artifacts: false
  rules:
    - if: '$CI_CHILD_PIPELINE != "true" && $CI_COMMIT_TAG'
    - when: never
