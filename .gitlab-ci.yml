stages:
  - .pre
  - test
  - build
  - deploy-dev
  - migrate-dev
  - smoke-test-dev
  - rollback-dev
  - deploy-staging
  - migrate-staging
  - smoke-test-staging
  - rollback-staging
  - deploy-prod
  - migrate-prod
  - smoke-test-prod
  - rollback-prod

variables:
  CI_CHILD_PIPELINE: "false"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# =============================================================================
# TEMPLATES
# =============================================================================

.deploy_template: &deploy_template
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl helm
    - |
      KUBECTL_VERSION="v1.30.0"
      curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
      chmod +x kubectl
      mv kubectl /usr/local/bin/kubectl
      kubectl version --client
    - |
      if [ -z "$CROO_KUBECONFIG" ]; then
        echo "ERROR: CROO_KUBECONFIG variable is not set"
        exit 1
      fi
      mkdir -p ~/.kube
      KUBECONFIG_FILE="$HOME/.kube/config"
      echo "$CROO_KUBECONFIG" | base64 -d > "$KUBECONFIG_FILE" 2>&1 || {
        echo "ERROR: Failed to decode CROO_KUBECONFIG"
        exit 1
      }
      chmod 600 "$KUBECONFIG_FILE"
      export KUBECONFIG="$KUBECONFIG_FILE"
    - chmod +x deploy/scripts/*.sh

.migrate_template: &migrate_template
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y git curl bash
    - |
      KUBECTL_VERSION="v1.30.0"
      curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
      chmod +x kubectl
      mv kubectl /usr/local/bin/kubectl
    - |
      if [ -z "$CROO_KUBECONFIG" ]; then
        echo "ERROR: CROO_KUBECONFIG variable is not set"
        exit 1
      fi
      mkdir -p ~/.kube
      KUBECONFIG_FILE="$HOME/.kube/config"
      echo "$CROO_KUBECONFIG" | base64 -d > "$KUBECONFIG_FILE" 2>&1 || {
        echo "ERROR: Failed to decode CROO_KUBECONFIG"
        exit 1
      }
      chmod 600 "$KUBECONFIG_FILE"
      export KUBECONFIG="$KUBECONFIG_FILE"
    - |
      if [ -z "${DATABASE_HOST:-}" ] || [ -z "${DATABASE_USER:-}" ] || [ -z "${DATABASE_PASSWORD:-}" ]; then
        echo "Warning: DATABASE vars not set for ${ENV}, skipping migrations"
        exit 0
      fi
      ENCODED_PASSWORD=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ.get('DATABASE_PASSWORD', ''), safe=''))")
      ENCODED_USER=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ.get('DATABASE_USER', ''), safe=''))")
      export DATABASE_URL="postgresql+psycopg://${ENCODED_USER}:${ENCODED_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-croo_digital_experience}"
      echo "Database configured: ${DATABASE_HOST}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-croo_digital_experience}"
    - chmod +x deploy/scripts/*.sh
    - pip install --upgrade pip

.smoke_test_template: &smoke_test_template
  image: curlimages/curl:latest
  timeout: 5m
  allow_failure: false
  before_script:
    - |
      wait_for_gateway() {
        local URL="${1}"
        local MAX="${2:-30}"
        local INTERVAL="${3:-5}"
        if [ -z "${URL}" ]; then echo "ERROR: INGRESS_URL not set"; return 1; fi
        echo "Waiting for gateway at ${URL}..."
        i=1
        while [ ${i} -le ${MAX} ]; do
          HTTP_CODE=$(curl -k --max-time 10 --connect-timeout 5 -s -o /dev/null -w "%{http_code}" "${URL}/" 2>/dev/null)
          if [ -n "${HTTP_CODE}" ] && [ "${HTTP_CODE}" != "000" ]; then
            echo "Gateway ready (HTTP ${HTTP_CODE})"; return 0
          fi
          sleep ${INTERVAL}; i=$((i + 1))
        done
        echo "Gateway did not become ready"; return 1
      }

# =============================================================================
# FRONTEND
# =============================================================================

test:frontend:
  stage: test
  image: node:22-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - |
      if [ -f "angular.json" ] && grep -q '"test"' angular.json; then
        npm run test -- --code-coverage --watch=false --browsers=ChromeHeadless || echo "Tests not configured yet"
      else
        echo "Test configuration not found, skipping..."
      fi
  artifacts:
    when: always
    reports:
      junit: frontend/test-results.xml
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - when: never
  allow_failure: true

build:frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - |
      if [ -z "$CI_SERVER_HOST" ]; then echo "ERROR: CI_SERVER_HOST is not set"; exit 1; fi
      if [ -z "$CI_PROJECT_PATH" ]; then echo "ERROR: CI_PROJECT_PATH is not set"; exit 1; fi
      if [ -z "$CI_REGISTRY" ]; then export CI_REGISTRY="registry.${CI_SERVER_HOST}"; fi
      export CI_REGISTRY_IMAGE="${CI_REGISTRY}/${CI_PROJECT_PATH}"
    - set +x
    - echo "$CI_JOB_TOKEN" | docker login -u ${CI_REGISTRY_USER:-gitlab-ci-token} --password-stdin $CI_REGISTRY
  script:
    - |
      docker pull ${CI_REGISTRY_IMAGE}/frontend:latest || true
      docker build \
        --cache-from ${CI_REGISTRY_IMAGE}/frontend:latest \
        --target production \
        -f frontend/Dockerfile \
        -t ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA} .
      docker tag ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA} ${CI_REGISTRY_IMAGE}/frontend:latest
      docker push ${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA}
      docker push ${CI_REGISTRY_IMAGE}/frontend:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
    - when: never

# =============================================================================
# COPY TLS CERTIFICATE (per env)
# =============================================================================

.copy_cert_template: &copy_cert_template
  <<: *deploy_template
  script:
    - |
      CERT_NS="${CERT_MANAGER_NAMESPACE:-cert-manager}"
      echo "Copying TLS secret '${TLS_SECRET_NAME}' from namespace '${CERT_NS}' to '${NAMESPACE}'..."
      if [ -z "${TLS_SECRET_NAME:-}" ] || [ "${TLS_SECRET_NAME}" = "CHANGE_ME" ]; then
        echo "Warning: TLS_SECRET_NAME not configured for ${ENV}, skipping"
        exit 0
      fi
      # Export secret from cert-manager namespace and re-import into project namespace
      kubectl get secret "${TLS_SECRET_NAME}" -n "${CERT_NS}" -o yaml \
        | sed "s/namespace: ${CERT_NS}/namespace: ${NAMESPACE}/" \
        | kubectl apply -n "${NAMESPACE}" -f -
      echo "Certificate '${TLS_SECRET_NAME}' copied to namespace '${NAMESPACE}'"

# =============================================================================
# DEV ENVIRONMENT (develop branch)
# =============================================================================

copy-cert:dev:
  <<: *copy_cert_template
  stage: deploy-dev
  variables:
    ENV: dev
    NAMESPACE: cde-dev
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

deploy:frontend:dev:
  <<: *deploy_template
  stage: deploy-dev
  variables:
    ENV: dev
    NAMESPACE: cde-dev
  environment:
    name: dev
    url: ${INGRESS_URL}
  script:
    - ./deploy/scripts/deploy-frontend.sh dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never
  needs:
    - job: build:frontend
      artifacts: false

deploy:gateway:dev:
  <<: *deploy_template
  stage: deploy-dev
  variables:
    ENV: dev
    NAMESPACE: cde-dev
  environment:
    name: dev
    url: ${INGRESS_URL}
  script:
    - ./deploy/scripts/create-gateway.sh dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never
  needs:
    - job: build:frontend
      artifacts: false
    - job: trigger:api-deploy-jobs:dev
      artifacts: false

provision:admin-user:dev:
  <<: *deploy_template
  stage: deploy-dev
  variables:
    ENV: dev
    NAMESPACE: cde-dev
  environment:
    name: dev
  script:
    - |
      if [ -z "${ADMIN_PASSWORD}" ] || [ "${ADMIN_PASSWORD}" = "CHANGE_ME" ]; then
        echo "Warning: ADMIN_PASSWORD not set, skipping"
        exit 0
      fi
      REGISTER_URL="${INGRESS_URL}/api/v1/auth/register"
      HEALTH_URL="${INGRESS_URL}/api/v1/auth/health"
      echo "Waiting for auth-api..."
      i=1; while [ $i -le 30 ]; do
        if curl -f -k --max-time 5 -s "${HEALTH_URL}" > /dev/null 2>&1; then echo "auth-api ready"; break; fi
        sleep 2; i=$((i + 1))
      done
      echo "Creating/updating admin user..."
      RESPONSE=$(curl -k -s -w "\n%{http_code}" -X POST "${REGISTER_URL}" \
        -H "Content-Type: application/json" \
        -d "{\"email\":\"${ADMIN_USERNAME}\",\"password\":\"${ADMIN_PASSWORD}\",\"first_name\":\"Admin\",\"last_name\":\"Croo\"}" 2>&1)
      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
      BODY=$(echo "$RESPONSE" | sed '$d')
      if [ "$HTTP_CODE" = "201" ]; then echo "Admin user created!"
      elif [ "$HTTP_CODE" = "400" ] && (echo "$BODY" | grep -qE "existe|exists"); then echo "Admin user already exists (OK)"
      else echo "Warning: Failed to create admin user (HTTP $HTTP_CODE) - not critical"; fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never
  needs:
    - job: deploy:gateway:dev
      artifacts: false
  allow_failure: true

smoke-test:frontend:dev:
  <<: *smoke_test_template
  stage: smoke-test-dev
  environment:
    name: dev
  script:
    - |
      wait_for_gateway "${INGRESS_URL}" 30 5
      sleep 30
      i=1; while [ $i -le 5 ]; do
        if curl -f -k --max-time 30 --retry 2 --retry-delay 3 -s ${INGRESS_URL}/health | grep -q "healthy"; then
          echo "Frontend healthy in dev"; exit 0
        fi
        sleep 5; i=$((i + 1))
      done
      exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never
  needs:
    - job: deploy:frontend:dev
      artifacts: false
    - job: deploy:gateway:dev
      artifacts: false

rollback:frontend:dev:
  <<: *deploy_template
  stage: rollback-dev
  environment:
    name: dev
  script:
    - helm rollback frontend 0 --namespace cde-dev --wait --timeout 5m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
    - when: never
  allow_failure: true

rollback:gateway:dev:
  <<: *deploy_template
  stage: rollback-dev
  environment:
    name: dev
  script:
    - helm rollback gateway 0 --namespace cde-dev --wait --timeout 5m
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
    - when: never
  allow_failure: true

