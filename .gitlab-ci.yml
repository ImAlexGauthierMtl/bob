            docker tag ${CI_REGISTRY_IMAGE}/${API_NAME}:${CI_COMMIT_SHA} ${CI_REGISTRY_IMAGE}/${API_NAME}:latest
            docker push ${CI_REGISTRY_IMAGE}/${API_NAME}:${CI_COMMIT_SHA}
            docker push ${CI_REGISTRY_IMAGE}/${API_NAME}:latest
        rules:
          - when: on_success

      BUILD_JOBS_EOF

      for api in ${APIS}; do
        {
          echo ""
          echo "build:${api}:"
          echo "  extends: .build_template"
          echo "  variables:"
          echo "    API_NAME: ${api}"
          echo "  rules:"
          echo "    - when: on_success"
