    paths:
      - .gitlab/ci/api-build-jobs.yml
    expire_in: 1 hour

# Generate API deploy jobs
generate:api-deploy-jobs:
  stage: .pre
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  script:
    - apk add --no-cache bash
    - chmod +x deploy/scripts/*.sh
    - |
      APIS=$(./deploy/scripts/discover-apis.sh)
      echo "Discovered APIs: ${APIS}"
      mkdir -p .gitlab/ci

      cat > .gitlab/ci/api-deploy-jobs.yml << 'DEPLOY_EOF'
      stages:
        - deploy-dev

      variables:
        CI_CHILD_PIPELINE: "true"

      .deploy_template: &deploy_template
        image: alpine:latest
        before_script:
          - apk add --no-cache bash curl helm
          - |
            KUBECTL_VERSION="v1.30.0"
            curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            chmod +x kubectl
            mv kubectl /usr/local/bin/kubectl
            kubectl version --client
          - |
            if [ -z "$KUBECONFIG" ]; then
              echo "ERROR: KUBECONFIG variable is not set"
              exit 1
            fi
            mkdir -p ~/.kube
            KUBECONFIG_FILE="$HOME/.kube/config"
            echo "$KUBECONFIG" | base64 -d > "$KUBECONFIG_FILE" 2>&1 || {
              echo "ERROR: Failed to decode KUBECONFIG"
              exit 1
            }
            chmod 600 "$KUBECONFIG_FILE"
            export KUBECONFIG="$KUBECONFIG_FILE"
          - chmod +x deploy/scripts/*.sh
        environment:
          name: ${ENV}
          url: ${INGRESS_URL}

      .migrate_template: &migrate_template
        image: python:3.11-slim
        before_script:
          - apt-get update && apt-get install -y git curl bash
          - |
            KUBECTL_VERSION="v1.30.0"
            curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
            chmod +x kubectl
            mv kubectl /usr/local/bin/kubectl
          - |
            if [ -z "$KUBECONFIG" ]; then
              echo "ERROR: KUBECONFIG variable is not set"
              exit 1
            fi
            mkdir -p ~/.kube
            KUBECONFIG_FILE="$HOME/.kube/config"
            echo "$KUBECONFIG" | base64 -d > "$KUBECONFIG_FILE" 2>&1 || {
              echo "ERROR: Failed to decode KUBECONFIG"
              exit 1
            }
            chmod 600 "$KUBECONFIG_FILE"
            export KUBECONFIG="$KUBECONFIG_FILE"
          - |
            if [ -z "${DATABASE_HOST:-}" ] || [ -z "${DATABASE_USER:-}" ] || [ -z "${DATABASE_PASSWORD:-}" ]; then
              echo "Warning: DATABASE vars not set for ${ENV}, skipping migrations"
              exit 0
            fi
            ENCODED_PASSWORD=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ.get('DATABASE_PASSWORD', ''), safe=''))")
            ENCODED_USER=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ.get('DATABASE_USER', ''), safe=''))")
            export DATABASE_URL="postgresql+psycopg://${ENCODED_USER}:${ENCODED_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-croo_digital_experience}"
          - chmod +x deploy/scripts/*.sh
          - pip install --upgrade pip

      DEPLOY_EOF

      for api in ${APIS}; do
        {
          echo ""
          echo "deploy:${api}:dev:"
          echo "  extends: .deploy_template"
          echo "  stage: deploy-dev"
          echo "  variables:"
          echo "    API_NAME: ${api}"
          echo "    ENV: dev"
          echo "    NAMESPACE: cde-dev"
          echo "    INGRESS_URL: \${DEV_INGRESS_URL}"
          echo "    KUBECONFIG: \${DEV_KUBECONFIG}"
          echo "    DATABASE_HOST: \${DEV_DATABASE_HOST}"
          echo "    DATABASE_USER: \${DEV_DATABASE_USER}"
          echo "    DATABASE_PASSWORD: \${DEV_DATABASE_PASSWORD}"
          echo "    DATABASE_NAME: \${DEV_DATABASE_NAME}"
          echo "    DATABASE_PORT: \${DEV_DATABASE_PORT}"
          if [[ "${api}" == "auth-api" ]]; then
            echo "    ADMIN_USERNAME: \${DEV_ADMIN_USERNAME}"
            echo "    ADMIN_PASSWORD: \${DEV_ADMIN_PASSWORD}"
          fi
          echo "  script:"
          echo "    - ./deploy/scripts/deploy-api.sh ${api} dev"
          echo "  rules:"
          echo "    - if: '\$CI_CHILD_PIPELINE == \"true\"'"
          echo "      when: on_success"
          echo "    - if: '\$CI_COMMIT_BRANCH == \"develop\"'"
          echo "      when: on_success"
          echo "    - when: never"
          echo ""

          # Add migration job for backend APIs (skip B4F APIs)
          if [[ "${api}" != *"-b4f-api" ]] && [[ "${api}" != "b4f-api" ]]; then
            echo "migrate:${api}:dev:"
            echo "  extends: .migrate_template"
            echo "  stage: deploy-dev"
            echo "  variables:"
            echo "    API_NAME: ${api}"
            echo "    ENV: dev"
            echo "    NAMESPACE: cde-dev"
            echo "    KUBECONFIG: \${DEV_KUBECONFIG}"
            echo "    DATABASE_HOST: \${DEV_DATABASE_HOST}"
            echo "    DATABASE_USER: \${DEV_DATABASE_USER}"
            echo "    DATABASE_PASSWORD: \${DEV_DATABASE_PASSWORD}"
            echo "    DATABASE_NAME: \${DEV_DATABASE_NAME}"
            echo "    DATABASE_PORT: \${DEV_DATABASE_PORT}"
            echo "  script:"
            # Convert k8s name to directory name for cd
            DIR_NAME=$(echo "${api}" | sed -E 's/-(b4f-api|backend-api)/~\1/')
            echo "    - cd apis/${DIR_NAME}"
            echo "    - pip install -r requirements.txt"
            echo "    - |"
            echo "      if [ -f \"migrate.sh\" ]; then"
            echo "        chmod +x migrate.sh"
            echo "        ./migrate.sh"
            echo "      elif [ -d \"alembic\" ]; then"
            echo "        alembic upgrade head"
            echo "      else"
            echo "        echo \"No migration mechanism found, skipping...\""
            echo "      fi"
            echo "  rules:"
            echo "    - if: '\$CI_CHILD_PIPELINE == \"true\"'"
            echo "      when: on_success"
            echo "    - if: '\$CI_COMMIT_BRANCH == \"develop\"'"
            echo "      when: on_success"
            echo "    - when: never"
            echo "  needs:"
            echo "    - job: deploy:${api}:dev"
            echo "      artifacts: false"
            echo ""
          fi
        } >> .gitlab/ci/api-deploy-jobs.yml
      done

      echo "Generated deploy jobs for $(echo "${APIS}" | wc -l) APIs"
  artifacts:
    paths:
      - .gitlab/ci/api-deploy-jobs.yml
    expire_in: 1 hour

# Generate API smoke test jobs
generate:api-smoke-test-jobs:
  stage: .pre
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG'
      when: on_success
    - when: never
  script:
    - apk add --no-cache bash
    - chmod +x deploy/scripts/*.sh
    - |
      APIS=$(./deploy/scripts/discover-apis.sh)
      echo "Discovered APIs: ${APIS}"
      mkdir -p .gitlab/ci

      cat > .gitlab/ci/api-smoke-test-jobs.yml << 'SMOKE_EOF'
      stages:
        - smoke-test-dev

      variables:
        CI_CHILD_PIPELINE: "true"

      .smoke_test_template: &smoke_test_template
        image: curlimages/curl:latest
        timeout: 5m
        allow_failure: false
        before_script:
          - |
            wait_for_gateway() {
              local INGRESS_URL="${1}"
              local MAX_ATTEMPTS="${2:-30}"
              local INTERVAL="${3:-5}"
              if [ -z "${INGRESS_URL}" ]; then
                echo "ERROR: INGRESS_URL is not set"
                return 1
              fi
              echo "Waiting for gateway at ${INGRESS_URL}..."
              i=1
              while [ ${i} -le ${MAX_ATTEMPTS} ]; do
                HTTP_CODE=$(curl -k --max-time 10 --connect-timeout 5 -s -o /dev/null -w "%{http_code}" "${INGRESS_URL}/" 2>/dev/null)
                CURL_EXIT=$?
                if [ "${CURL_EXIT}" -eq 0 ] && [ -n "${HTTP_CODE}" ] && [ "${HTTP_CODE}" != "000" ]; then
                  if echo "${HTTP_CODE}" | grep -qE '^[0-9]{3}$'; then
                    echo "Gateway is ready (HTTP ${HTTP_CODE})"
                    return 0
                  fi
                fi
                if [ ${i} -lt ${MAX_ATTEMPTS} ]; then
                  sleep ${INTERVAL}
                fi
                i=$((i + 1))
              done
              echo "Gateway did not become ready"
              return 1
            }

      SMOKE_EOF

      for api in ${APIS}; do
        # Skip backend APIs (internal, not reachable via gateway)
        if echo "${api}" | grep -q "\-backend-"; then
          continue
        fi

        ROUTE_PREFIX_DEV=$(./deploy/scripts/get-api-route-prefix.sh "${api}" dev 2>/dev/null || echo "${api}" | sed 's/-api$//')

        {
          echo ""
          echo "smoke-test:${api}:dev:"
          echo "  extends: .smoke_test_template"
          echo "  stage: smoke-test-dev"
          echo "  script:"
          echo "    - |"
          echo "      export DEV_INGRESS_URL=\"\${DEV_INGRESS_URL:-https://app-cde-dev-01.dev.thesmartcrew.com}\""
          echo "      wait_for_gateway \"\${DEV_INGRESS_URL}\" 30 5"
          echo "      echo \"Testing ${api} health in dev...\""
          echo "      HEALTH_URL=\"\${DEV_INGRESS_URL}/api/v1/${ROUTE_PREFIX_DEV}/health\""
          echo "      echo \"Waiting 90s for ${api} to be ready...\""
          echo "      sleep 90"
          echo "      i=1"
          echo "      while [ \${i} -le 10 ]; do"
          echo "        RESPONSE=\$(curl -k -s -w \"\\n%{http_code}\" --max-time 30 \"\${HEALTH_URL}\" 2>/dev/null)"
          echo "        HTTP_CODE=\$(echo \"\${RESPONSE}\" | tail -n1)"
          echo "        BODY=\$(echo \"\${RESPONSE}\" | sed '\$d')"
          echo "        if [ \"\${HTTP_CODE}\" = \"200\" ] && echo \"\${BODY}\" | grep -q '\"status\"'; then"
          echo "          echo \"${api} is healthy in dev (HTTP \${HTTP_CODE})\""
          echo "          exit 0"
          echo "        else"
          echo "          echo \"Attempt \${i} failed (HTTP \${HTTP_CODE}), retrying in 10s...\""
          echo "          sleep 10"
          echo "        fi"
          echo "        i=\$((i + 1))"
          echo "      done"
          echo "      echo \"${api} did not respond correctly after 10 attempts\""
          echo "      exit 1"
          echo "  rules:"
          echo "    - if: '\$CI_COMMIT_BRANCH == \"develop\"'"
          echo "      when: on_success"
          echo "    - when: never"
        } >> .gitlab/ci/api-smoke-test-jobs.yml
      done

      echo "Generated smoke test jobs"
  artifacts:
    paths:
      - .gitlab/ci/api-smoke-test-jobs.yml
    expire_in: 1 hour

# =============================================================================
# CHILD PIPELINE TRIGGERS
# =============================================================================

trigger:api-tests-jobs:
  stage: test
  trigger:
    include:
      - artifact: .gitlab/ci/api-test-jobs.yml
        job: generate:api-test-jobs
    strategy: depend
  needs:
    - job: generate:api-test-jobs
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

trigger:api-build-jobs:
  stage: build
  trigger:
    include:
      - artifact: .gitlab/ci/api-build-jobs.yml
        job: generate:api-build-jobs
    strategy: depend
  needs:
    - job: generate:api-build-jobs
      artifacts: true
    - job: trigger:api-tests-jobs
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

trigger:api-deploy-jobs:dev:
  stage: deploy-dev
  trigger:
    include:
      - artifact: .gitlab/ci/api-deploy-jobs.yml
        job: generate:api-deploy-jobs
    strategy: depend
  needs:
    - job: generate:api-deploy-jobs
      artifacts: true
    - job: trigger:api-build-jobs
      artifacts: false
  rules:
    - if: '$CI_CHILD_PIPELINE != "true" && $CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - when: never

trigger:api-smoke-test-jobs:dev:
  stage: smoke-test-dev
  trigger:
    include:
      - artifact: .gitlab/ci/api-smoke-test-jobs.yml
        job: generate:api-smoke-test-jobs
    strategy: depend
  needs:
    - job: generate:api-smoke-test-jobs
      artifacts: true
    - job: trigger:api-deploy-jobs:dev
      artifacts: false
    - job: deploy:gateway:dev
      artifacts: false
  rules:
    - if: '$CI_CHILD_PIPELINE != "true" && $CI_COMMIT_BRANCH == "develop"'
      when: on_success
    - when: never
