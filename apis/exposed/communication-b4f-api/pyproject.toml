[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "communication-b4f-api"
version = "0.1.0"
description = "Communication B4F API for Croo Digital Experience"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-jose[cryptography]>=3.3",
  "structlog>=23.0",
  "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "import-linter>=2.0",
]

[tool.setuptools]
packages = ["communication_b4f_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"


[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain application infrastructure do not import presentation"
type = "forbidden"
source_modules = [
  "app.domain",
  "app.application",
  "app.infrastructure",
]
forbidden_modules = ["app.presentation"]

[[tool.importlinter.contracts]]
name = "application avoids framework dependencies"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.application"]
forbidden_modules = [
  "fastapi",
  "sqlalchemy",
  "httpx",
  "redis",
  "pydantic_settings",
]
