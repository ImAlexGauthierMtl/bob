[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-b4f-api"
version = "0.1.0"
description = "Agent Control B4F deployable wrapper for Croo Digital Experience"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-jose[cryptography]>=3.3",
  "structlog>=23.0",
  "httpx>=0.24",
]

[tool.setuptools]
packages = ["agent_control_b4f_api"]
