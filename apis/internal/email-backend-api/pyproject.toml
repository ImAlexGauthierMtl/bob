[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-backend-api"
version = "0.1.0"
description = "Email Backend API for Croo Digital Experience"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "psycopg[binary]>=3.1",
  "python-jose[cryptography]>=3.3",
  "structlog>=23.0",
  "httpx>=0.24",
  "redis[hiredis]>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "import-linter>=2.0",
]

[tool.setuptools]
packages = ["email_backend_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
  "app/infrastructure/external/*",
  "app/presentation/ms365_provider_operations.py",
  "app/presentation/routes/provider_pipedream_routes.py",
]


[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain application infrastructure do not import presentation"
type = "forbidden"
source_modules = [
  "app.domain",
  "app.application",
  "app.infrastructure",
]
forbidden_modules = ["app.presentation"]

[[tool.importlinter.contracts]]
name = "application avoids framework dependencies"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.application"]
forbidden_modules = [
  "fastapi",
  "sqlalchemy",
  "httpx",
  "redis",
  "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "domain avoids framework dependencies"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["app.domain"]
forbidden_modules = [
  "fastapi",
  "sqlalchemy",
  "pydantic",
  "pydantic_settings",
  "httpx",
  "redis",
]
