<div class="settings-layout" [class.settings-layout--full]="isFullWidth">

    <!-- Settings Sidebar Nav — hidden on automation routes -->
    @if (!isFullWidth) {
    <aside class="settings-nav">

        <!-- My Settings -->
        <div class="settings-nav__section">
            <h3 class="settings-nav__heading">My Settings</h3>
            <nav class="settings-nav__list">
                <a routerLink="profile" routerLinkActive="settings-nav__link--active" class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-user"></i>
                        <span>Profile</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
                <a routerLink="my-tools" routerLinkActive="settings-nav__link--active" class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-list-check"></i>
                        <span>My Tool Access</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
                <a routerLink="integrations" routerLinkActive="settings-nav__link--active" class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-plug"></i>
                        <span>Integrations</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
            </nav>
        </div>

        <!-- Bob Features -->
        <div class="settings-nav__section">
            <h3 class="settings-nav__heading">Bob Features</h3>
            <nav class="settings-nav__list">
                <a routerLink="bob" routerLinkActive="settings-nav__link--active" class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>Bob Assistant</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
                <a routerLink="automation" routerLinkActive="settings-nav__link--active" class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-bolt"></i>
                        <span>Automation</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
                <a routerLink="bob-control-center" routerLinkActive="settings-nav__link--active"
                    class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-sliders"></i>
                        <span>Control Center</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
            </nav>
        </div>

        <!-- Organization -->
        <div class="settings-nav__section">
            <h3 class="settings-nav__heading">Organization</h3>
            <nav class="settings-nav__list">
                <a routerLink="team" routerLinkActive="settings-nav__link--active" class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-users"></i>
                        <span>Team Members</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
                <a routerLink="roles" routerLinkActive="settings-nav__link--active" class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>Roles & Permissions</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
                <a routerLink="platform-access" routerLinkActive="settings-nav__link--active"
                    class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-building-shield"></i>
                        <span>Platform Access</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
                <a routerLink="tool-governance" routerLinkActive="settings-nav__link--active"
                    class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-shield-halved"></i>
                        <span>Tool Governance</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
                <a routerLink="knowledge" routerLinkActive="settings-nav__link--active"
                    class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-book-open-reader"></i>
                        <span>Knowledge</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
            </nav>
        </div>

        <!-- Catalog -->
        <div class="settings-nav__section">
            <h3 class="settings-nav__heading">Catalog</h3>
            <nav class="settings-nav__list">
                <a routerLink="products" routerLinkActive="settings-nav__link--active" class="settings-nav__link">
                    <div class="settings-nav__link-left">
                        <i class="fa-solid fa-box"></i>
                        <span>Products</span>
                    </div>
                    <i class="fa-solid fa-chevron-right settings-nav__chevron"></i>
                </a>
            </nav>
        </div>

        <!-- Sign Out -->
        <div class="settings-nav__footer">
            <button class="settings-nav__signout" type="button" (click)="logout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                <span>Sign Out</span>
            </button>
        </div>

    </aside>
    }

    <!-- Settings Content -->
    <section class="settings-content">
        <router-outlet></router-outlet>
    </section>

</div>
