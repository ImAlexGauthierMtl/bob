<div class="inbox-layout">
    <header class="inbox-header">
        <div class="inbox-header__title-area">
            <h2 class="inbox-header__title">Inbox</h2>
            <p class="inbox-header__subtitle">Conversations, replies and follow-ups in one place.</p>
        </div>

        <div class="inbox-toolbar">
            <div class="inbox-search">
                <i class="fa-solid fa-search inbox-search__icon"></i>
                <input type="text" placeholder="Search mail" class="inbox-search__input">
            </div>
        </div>

        <a routerLink="/dashboard" class="inbox-close" aria-label="Close mailbox">
            <i class="fa-solid fa-xmark"></i>
        </a>
    </header>

    <main class="inbox-main">
        <div class="inbox-grid" [class.inbox-grid--reading]="selectedEmail$ | async">
            <div class="inbox-sidebar-col">
                <app-inbox-sidebar (composeRequested)="openCompose()" (filterChanged)="onFilterChanged($event)"></app-inbox-sidebar>
            </div>

            <div class="inbox-list-col">
                <app-email-list [filter]="currentFilter" (emailSelected)="onEmailSelected($event)"></app-email-list>
            </div>

            <div class="inbox-reading-col">
                <app-email-reading-pane
                    [email]="selectedEmail$ | async"
                    (backRequested)="clearSelectedEmail()"
                    (emailActionCompleted)="onEmailActionCompleted()">
                </app-email-reading-pane>
            </div>
        </div>
    </main>

    <app-email-compose 
        *ngIf="isComposeOpen" 
        (close)="closeCompose()" 
        (emailSent)="onEmailSent()">
    </app-email-compose>
</div>
