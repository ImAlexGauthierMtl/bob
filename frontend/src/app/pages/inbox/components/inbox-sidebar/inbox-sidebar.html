<div class="inbox-sidebar">
    <button type="button" class="inbox-compose" (click)="openCompose()">
        <i class="fa-solid fa-pen"></i>
        <span>Compose</span>
    </button>

    <div class="inbox-sidebar__section">
        <p class="inbox-sidebar__title">Mailbox</p>
        <nav class="inbox-nav" aria-label="Mailbox folders">
            <button (click)="setFolder('All Mail')" [class.inbox-nav__item--active]="activeFolder === 'All Mail'" class="inbox-nav__item">
                <span class="inbox-nav__link-left">
                    <i class="fa-solid fa-inbox inbox-nav__icon"></i>
                    <span>Inbox</span>
                </span>
            </button>
            <button (click)="setFilter('unread_ai')" [class.inbox-nav__item--active]="activeFolder === '' && !activeSmartLabel" class="inbox-nav__item">
                <span class="inbox-nav__link-left">
                    <i class="fa-regular fa-envelope inbox-nav__icon"></i>
                    <span>Unread</span>
                </span>
            </button>
            <button (click)="setFilter('starred')" class="inbox-nav__item">
                <span class="inbox-nav__link-left">
                    <i class="fa-regular fa-star inbox-nav__icon"></i>
                    <span>Starred</span>
                </span>
            </button>
            <button (click)="setFolder('Sent Items')" [class.inbox-nav__item--active]="activeFolder === 'Sent Items'" class="inbox-nav__item">
                <span class="inbox-nav__link-left">
                    <i class="fa-regular fa-paper-plane inbox-nav__icon"></i>
                    <span>Sent</span>
                </span>
            </button>
            <button (click)="setFolder('Drafts')" [class.inbox-nav__item--active]="activeFolder === 'Drafts'" class="inbox-nav__item">
                <span class="inbox-nav__link-left">
                    <i class="fa-regular fa-file-lines inbox-nav__icon"></i>
                    <span>Drafts</span>
                </span>
            </button>
            <button (click)="setFolder('Deleted Items')" [class.inbox-nav__item--active]="activeFolder === 'Deleted Items'" class="inbox-nav__item">
                <span class="inbox-nav__link-left">
                    <i class="fa-regular fa-trash-can inbox-nav__icon"></i>
                    <span>Trash</span>
                </span>
            </button>
        </nav>
    </div>

    <div class="inbox-sidebar__section">
        <p class="inbox-sidebar__title">Priority</p>
        <nav class="inbox-nav" aria-label="Priority views">
            <button class="inbox-nav__item" (click)="setFilter('ai_priority')">
                <span class="inbox-nav__link-left">
                    <i class="fa-solid fa-arrow-up-wide-short inbox-nav__icon"></i>
                    <span>Priority</span>
                </span>
            </button>
            <button class="inbox-nav__item" (click)="setFilter('focus')">
                <span class="inbox-nav__link-left">
                    <i class="fa-regular fa-circle-dot inbox-nav__icon"></i>
                    <span>Actionable</span>
                </span>
            </button>
        </nav>
    </div>

    <div class="inbox-sidebar__section">
        <p class="inbox-sidebar__title">Labels</p>
        <nav class="inbox-nav" aria-label="Smart labels">
            <ng-container *ngIf="smartLabels$ | async as smartLabels">
            <ng-container *ngIf="smartLabels && smartLabels.length > 0; else noLabels">
                <button *ngFor="let label of smartLabels"
                    (click)="setSmartLabel(label.name)"
                    [class.inbox-nav__item--active]="activeSmartLabel === label.name"
                    class="inbox-nav__item">
                    <span class="inbox-nav__link-left">
                        <span class="inbox-nav__dot" [class]="'inbox-nav__dot--' + label.color"></span>
                        <span>{{ label.name }}</span>
                    </span>
                </button>
            </ng-container>
            <ng-template #noLabels>
                <p class="inbox-sidebar__empty">No labels yet.</p>
            </ng-template>
            </ng-container>
        </nav>
    </div>
</div>
