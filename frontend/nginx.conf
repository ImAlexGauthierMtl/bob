server {
    listen 4700;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver: works in both Docker Compose (127.0.0.11) and Kubernetes (kube-dns)
    # ipv6=off avoids AAAA lookup failures on some clusters
    resolver 127.0.0.11 kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    # Strip trailing slashes on API routes to avoid FastAPI 307 redirects
    rewrite ^(/api/.+)/$ $1 last;

    # Health check endpoint for smoke tests and probes
    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    # Angular SPA — fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # B4F: Auth
    location /api/v1/auth {
        set $upstream_auth http://auth-b4f-api:8001;
        proxy_pass $upstream_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/users {
        set $upstream_auth http://auth-b4f-api:8001;
        proxy_pass $upstream_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/tenants {
