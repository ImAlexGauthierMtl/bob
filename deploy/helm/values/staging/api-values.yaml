# Staging environment values for APIs

deployment:
  replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi

env:
  ENVIRONMENT: staging
  LOG_LEVEL: INFO
  LOG_FORMAT: json

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

imagePullSecrets:
  enabled: true
