# Production environment values for APIs
# Initial deployment — lean resources, scale up when needed

deployment:
  replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  ENVIRONMENT: production
  LOG_LEVEL: WARNING
  LOG_FORMAT: json

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

imagePullSecrets:
  enabled: true
