# Production environment values for frontend
# NOTE: API_BASE_URL and ENVIRONMENT are overridden dynamically
# from CI/CD variables (INGRESS_URL) via deploy-frontend.sh --set

deployment:
  replicas: 2

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  ENVIRONMENT: prod
  API_BASE_URL: ""

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

imagePullSecrets:
  enabled: true
