# Development environment values for APIs

deployment:
  replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  ENVIRONMENT: development
  LOG_LEVEL: DEBUG
  LOG_FORMAT: json

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

imagePullSecrets:
  enabled: true
