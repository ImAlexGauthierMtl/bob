# Development environment values for frontend
# NOTE: API_BASE_URL and ENVIRONMENT are overridden dynamically
# from CI/CD variables (INGRESS_URL) via deploy-frontend.sh --set

deployment:
  replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  ENVIRONMENT: dev
  API_BASE_URL: ""

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

imagePullSecrets:
  enabled: true
