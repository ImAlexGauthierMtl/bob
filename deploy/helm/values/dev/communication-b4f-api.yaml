# Development environment values for communication-b4f-api
# Contains Membrane integration credentials for the dev environment.
# These are rendered as a Kubernetes Secret (not a ConfigMap) by the Helm chart.

deployment:
  replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

env:
  ENVIRONMENT: development
  LOG_LEVEL: DEBUG
  LOG_FORMAT: json
  PUBLIC_API_URL: "https://app-cde-dev-01-dev.croo.thesmartcrew.com"

secrets:
  enabled: true
  membraneWorkspaceKey: "43db80da-f637-47a4-b7d7-7e301a4f4a62"
  membraneWorkspaceSecret: "58894bdf9473e03d69d48477e8c5b84b2850ee68615eedff7d48007e04c1efac"
  membraneWebhookSecret: ""

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false
