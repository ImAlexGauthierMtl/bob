{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-chart.configmapName" . }}
  labels:
    {{- include "api-chart.labels" . | nindent 4 }}
data:
  API_NAME: {{ .Values.api.name | quote }}
  API_PORT: {{ .Values.api.port | quote }}
  PORT: {{ .Values.api.port | quote }}
  ENVIRONMENT: {{ .Values.env.ENVIRONMENT | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  LOG_FORMAT: {{ .Values.env.LOG_FORMAT | quote }}
{{- end }}
