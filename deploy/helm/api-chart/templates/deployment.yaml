apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-chart.fullname" . }}
  labels:
    {{- include "api-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.deployment.strategy }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  strategy:
    {{- toYaml .Values.deployment.strategy | nindent 4 }}
  {{- end }}
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      {{- include "api-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "api-chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
      - name: {{ include "api-chart.imagePullSecretName" . }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.api.port }}
          protocol: TCP
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        envFrom:
        {{- if .Values.configMap.enabled }}
        - configMapRef:
            name: {{ include "api-chart.configmapName" . }}
        {{- end }}
        {{- if .Values.secrets.enabled }}
        - secretRef:
            name: {{ include "api-chart.secretName" . }}
        {{- end }}
        {{- if .Values.healthCheck.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.readinessCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessCheck.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessCheck.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessCheck.failureThreshold }}
        {{- end }}
        {{- if .Values.livenessCheck.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.livenessCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessCheck.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessCheck.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessCheck.failureThreshold }}
        {{- end }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
