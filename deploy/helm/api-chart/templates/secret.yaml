{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-chart.secretName" . }}
  labels:
    {{- include "api-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.jwtSecret }}
  SECRET_KEY: {{ .Values.secrets.jwtSecret | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.ms365ClientId }}
  MS365_CLIENT_ID: {{ .Values.secrets.ms365ClientId | quote }}
  {{- end }}
  {{- if .Values.secrets.ms365ClientSecret }}
  MS365_CLIENT_SECRET: {{ .Values.secrets.ms365ClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.ms365TenantId }}
  MS365_TENANT_ID: {{ .Values.secrets.ms365TenantId | quote }}
  {{- end }}
  {{- if .Values.secrets.ms365RedirectUri }}
  MS365_REDIRECT_URI: {{ .Values.secrets.ms365RedirectUri | quote }}
  {{- end }}
  {{- if .Values.secrets.membraneWorkspaceKey }}
  MEMBRANE_WORKSPACE_KEY: {{ .Values.secrets.membraneWorkspaceKey | quote }}
  {{- end }}
  {{- if .Values.secrets.membraneWorkspaceSecret }}
  MEMBRANE_WORKSPACE_SECRET: {{ .Values.secrets.membraneWorkspaceSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.membraneClientToken }}
  MEMBRANE_CLIENT_TOKEN: {{ .Values.secrets.membraneClientToken | quote }}
  {{- end }}
  {{- if .Values.secrets.membraneWebhookSecret }}
  MEMBRANE_WEBHOOK_SECRET: {{ .Values.secrets.membraneWebhookSecret | quote }}
  {{- end }}
{{- end }}
