apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "frontend-chart.fullname" . }}
  labels:
    {{- include "frontend-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- if not .Values.deployment.strategy }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  strategy:
    {{- toYaml .Values.deployment.strategy | nindent 4 }}
  {{- end }}
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      {{- include "frontend-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "frontend-chart.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets.enabled }}
      imagePullSecrets:
      - name: {{ include "frontend-chart.imagePullSecretName" . }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        env:
        {{- range $key, $value := .Values.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- if .Values.healthCheck.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.readinessCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessCheck.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessCheck.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessCheck.failureThreshold }}
        {{- end }}
        {{- if .Values.livenessCheck.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessCheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.livenessCheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessCheck.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessCheck.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessCheck.failureThreshold }}
        {{- end }}
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
