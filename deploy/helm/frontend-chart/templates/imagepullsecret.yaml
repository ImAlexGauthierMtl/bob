{{- if and .Values.imagePullSecrets.enabled .Values.imagePullSecrets.dockerconfigjson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frontend-chart.imagePullSecretName" . }}
  labels:
    {{- include "frontend-chart.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.imagePullSecrets.dockerconfigjson | b64enc }}
{{- end }}
