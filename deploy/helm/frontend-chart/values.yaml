# Default values for frontend-chart

# Frontend Configuration
frontend:
  name: frontend
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

# Deployment Configuration
deployment:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

# Resource Limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Health Checks
healthCheck:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessCheck:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

livenessCheck:
  enabled: true
  path: /
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Service Configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 4700

# Ingress Configuration (managed by gateway-chart)
ingress:
  enabled: false

# Environment Variables
env:
  ENVIRONMENT: development
  API_BASE_URL: ""

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Image Pull Secrets (for private Docker registries)
imagePullSecrets:
  enabled: false
  name: ""
  dockerconfigjson: ""
