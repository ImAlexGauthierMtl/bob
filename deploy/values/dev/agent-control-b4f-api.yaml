apiName: agent-control-b4f-api
apiTier: exposed
replicaCount: 1
service:
  targetPort: 8008
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
config:
  ENVIRONMENT: development
  LOG_LEVEL: DEBUG
  LOG_FORMAT: json
  PORT: '8008'
  API_PORT: '8008'
  API_NAME: agent-control-b4f-api
  OTEL_SERVICE_NAME: agent-control-b4f-api
  CDE_B4F_SURFACE: agent-control
secretRefs:
- name: b4f-runtime-secrets
initContainers:
  migrate:
    enabled: false
backends:
- agent-backend-api
