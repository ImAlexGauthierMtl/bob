apiName: opportunity-backend-api
apiTier: internal
replicaCount: 1
service:
  targetPort: 9004
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
config:
  ENVIRONMENT: development
  LOG_LEVEL: DEBUG
  LOG_FORMAT: json
  PORT: '9004'
  API_PORT: '9004'
secretRefs:
- name: backend-runtime-secrets
initContainers:
  migrate:
    enabled: true
externalDependencies:
- postgres
- redis
backends: []
