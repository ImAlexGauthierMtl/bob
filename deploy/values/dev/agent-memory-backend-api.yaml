apiName: agent-memory-backend-api
apiTier: internal
replicaCount: 1
service:
  targetPort: 9014
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 320Mi
config:
  ENVIRONMENT: development
  LOG_LEVEL: DEBUG
  LOG_FORMAT: json
  PORT: '9014'
  API_PORT: '9014'
  MILVUS_ENABLED: 'false'
  MILVUS_DB_NAME: default
  MILVUS_SECURE: 'false'
  MILVUS_CONNECT_TIMEOUT_SECONDS: '5'
  MILVUS_DEFAULT_DIMENSION: '1536'
  EMBEDDINGS_PROVIDER: disabled
  EMBEDDINGS_MODEL: ''
  EMBEDDINGS_DIMENSION: '1536'
secretRefs:
- name: backend-memory-secrets
initContainers:
  migrate:
    enabled: true
externalDependencies:
- postgres
- redis
backends: []
