apiName: auth-b4f-api
apiTier: exposed
replicaCount: 1
service:
  targetPort: 8001
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
config:
  ENVIRONMENT: development
  LOG_LEVEL: DEBUG
  LOG_FORMAT: json
  PORT: '8001'
  API_PORT: '8001'
secretRefs:
- name: b4f-runtime-secrets
initContainers:
  migrate:
    enabled: false
