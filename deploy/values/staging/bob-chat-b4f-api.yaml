apiName: bob-chat-b4f-api
apiTier: exposed
replicaCount: 1
service:
  targetPort: 8007
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
config:
  ENVIRONMENT: staging
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  PORT: '8007'
  API_PORT: '8007'
  BOB_CLOUD_MODE: real
  CONVERSATION_BACKEND_API_URL: http://conversation-backend-api:9012
  AGENT_RUNTIME_BACKEND_API_URL: http://agent-runtime-backend-api:9013
  AGENT_MEMORY_BACKEND_API_URL: http://agent-memory-backend-api:9014
secretRefs:
- name: b4f-runtime-secrets
- name: bob-cloud-runtime-secrets
initContainers:
  migrate:
    enabled: false
backends:
- conversation-backend-api
- agent-runtime-backend-api
- agent-memory-backend-api
