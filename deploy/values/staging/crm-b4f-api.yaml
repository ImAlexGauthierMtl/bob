apiName: crm-b4f-api
apiTier: exposed
replicaCount: 1
service:
  targetPort: 8002
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
config:
  ENVIRONMENT: staging
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  PORT: '8002'
  API_PORT: '8002'
secretRefs:
- name: b4f-runtime-secrets
initContainers:
  migrate:
    enabled: false
