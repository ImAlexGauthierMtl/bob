apiName: agent-backend-api
apiTier: internal
replicaCount: 1
service:
  targetPort: 9008
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
config:
  ENVIRONMENT: staging
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  PORT: '9008'
  API_PORT: '9008'
secretRefs:
- name: backend-runtime-secrets
initContainers:
  migrate:
    enabled: true
externalDependencies:
- postgres
- redis
backends: []
