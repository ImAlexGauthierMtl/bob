apiName: contact-backend-api
apiTier: internal
replicaCount: 1
service:
  targetPort: 9002
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
config:
  ENVIRONMENT: production
  LOG_LEVEL: WARNING
  LOG_FORMAT: json
  PORT: '9002'
  API_PORT: '9002'
secretRefs:
- name: backend-runtime-secrets
initContainers:
  migrate:
    enabled: true
externalDependencies:
- postgres
- redis
backends: []
