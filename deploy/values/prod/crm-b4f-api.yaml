apiName: crm-b4f-api
apiTier: exposed
replicaCount: 1
service:
  targetPort: 8002
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
config:
  ENVIRONMENT: production
  LOG_LEVEL: WARNING
  LOG_FORMAT: json
  PORT: '8002'
  API_PORT: '8002'
secretRefs:
- name: b4f-runtime-secrets
initContainers:
  migrate:
    enabled: false
