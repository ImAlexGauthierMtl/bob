apiName: platform-b4f-api
apiTier: exposed
replicaCount: 1
service:
  targetPort: 8005
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
config:
  ENVIRONMENT: production
  LOG_LEVEL: WARNING
  LOG_FORMAT: json
  PORT: '8005'
  API_PORT: '8005'
  BOB_CLOUD_MODE: real
secretRefs:
- name: b4f-runtime-secrets
- name: bob-cloud-runtime-secrets
initContainers:
  migrate:
    enabled: false
